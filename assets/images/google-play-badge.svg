<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Badge Background -->
  <rect width="200" height="60" rx="12" fill="#000000" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Play Store Logo Triangles -->
  <g transform="translate(18, 12)">
    <!-- Base triangle and colored wedges -->
    <defs>
      <linearGradient id="pGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00C1FF" />
        <stop offset="100%" stop-color="#0072FF" />
      </linearGradient>
      <linearGradient id="pGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FF3A44" />
        <stop offset="100%" stop-color="#C31162" />
      </linearGradient>
      <linearGradient id="pGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00E676" />
        <stop offset="100%" stop-color="#00B0FF" />
      </linearGradient>
      <linearGradient id="pGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFD600" />
        <stop offset="100%" stop-color="#FF6D00" />
      </linearGradient>
    </defs>
    
    <path d="M 3.8 2.2 C 2.4 3.7 1.6 6.0 1.6 8.9 L 1.6 27.1 C 1.6 30.0 2.4 32.3 3.8 33.8 L 19.5 18 Z" fill="url(#pGrad1)" />
    <path d="M 24.6 23.2 L 19.5 18 L 3.8 33.8 C 5.3 35.4 7.7 35.9 10.4 34.4 L 24.6 26.2 C 26.6 25.1 26.6 24.3 24.6 23.2 Z" fill="url(#pGrad2)" />
    <path d="M 3.8 2.2 L 19.5 18 L 24.6 12.8 L 10.4 4.6 C 7.7 3.1 5.3 3.6 3.8 2.2 Z" fill="url(#pGrad3)" />
    <path d="M 24.6 23.2 L 28.5 21 C 30.1 20.1 30.1 18.9 28.5 18 L 24.6 15.8 L 19.5 18 Z" fill="url(#pGrad4)" />
  </g>

  <!-- Typography -->
  <text x="64" y="22" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" letter-spacing="1">
    GET IT ON
  </text>
  <text x="64" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="0.2">
