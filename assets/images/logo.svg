<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Container (Rounded Hexagon/Shield) -->
  <g transform="translate(10, 10)">
    <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#hexGrad)" stroke="url(#logoGrad)" stroke-width="2.5" />
    <circle cx="50" cy="50" r="38" fill="url(#logoGrad)" opacity="0.12" filter="url(#glow)" />
    
    <!-- Stylized 'S' + Play Triangle / Rocket Element -->
    <path d="M 62 30 C 58 26, 42 25, 36 32 C 30 39, 36 48, 50 51 C 64 54, 70 61, 66 70 C 60 79, 42 78, 35 72" 
          stroke="url(#logoGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <polygon points="46,45 56,50 46,55" fill="#38bdf8" opacity="0.9" />
    <circle cx="64" cy="31" r="3.5" fill="#38bdf8" />
    <circle cx="35" cy="71" r="3.5" fill="#8b5cf6" />
  </g>

  <!-- Typography -->
  <text x="125" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    SAUD
  </text>
  <text x="238" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="800" fill="url(#logoGrad)" letter-spacing="-0.5">
    APP STUDIO
  </text>
  <text x="126" y="86" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="3.2">
    NEXT-GEN ANDROID UTILITIES
  </text>
</svg>
